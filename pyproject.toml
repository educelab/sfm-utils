[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "PySfMUtils"
version = "1.2.0"
description = "A Python library for interacting with Structure-from-Motion projects"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "Seth Parker", email = "c.seth.parker@uky.edu" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.26",
]

[project.urls]
Homepage = "https://github.com/educelab/sfm-utils"
Repository = "https://github.com/educelab/sfm-utils"
Issues = "https://github.com/educelab/sfm-utils/issues"

[tool.setuptools]
packages = ["sfm_utils"]
