name: Test

on:
  push:
    branches: [develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # Install from the package's own metadata rather than requirements.txt, so
      # CI exercises the real dependency declaration.
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      # numpy resolves to a different major across the matrix (numpy 2.5 requires
      # Python >= 3.12), so record what each leg actually got.
      - name: Report resolved environment
        run: |
          python -c "import sys; print(sys.version)"
          python -c "import numpy; print('numpy', numpy.__version__)"

      - name: Run tests
        run: python -m unittest -v test.sfm_utils_tests

  # The declared numpy floor is lower than anything pip resolves on its own
  # (3.11 gets 2.4.6, newer gets 2.5.3), so pin the floor exactly to keep
  # `numpy>=2` an actually-tested claim rather than an aspiration.
  minimum-deps:
    name: Minimum dependencies
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install package at the declared numpy floor
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "numpy==2.0.*"

      - name: Report resolved environment
        run: |
          python -c "import sys; print(sys.version)"
          python -c "import numpy; print('numpy', numpy.__version__)"

      - name: Run tests
        run: python -m unittest -v test.sfm_utils_tests
